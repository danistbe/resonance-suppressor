name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ matrix.os }}-juce-8.0.13

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ResonanceSuppressor-${{ matrix.name }}
          path: |
            build/ResonanceSuppressor_artefacts/Release/VST3/
            build/ResonanceSuppressor_artefacts/Release/AU/
          if-no-files-found: error
